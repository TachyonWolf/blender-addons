schema_version = "1.1.0"

id = "digits_assorted_tools"
version = "1.2.1"
name = "Digit's Assorted Tools"
tagline = "Rig, pose, camera and light setup, and texture baking helpers"
maintainer = "digit"
type = "add-on"

tags = ["Object", "Rigging", "Mesh"]

blender_version_min = "5.0.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/tests/",
  "/dist/",
  "/package.sh",
  "/install_dev.sh",
  "/assets/Previews/",
  "*.blend1",
  "*.bak",
  "*.bak.*",
  "/.git/",
]
